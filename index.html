<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Электрички: Михановичи ⇄ Минск</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        cardBg: '#12141c',
                        cardBorder: '#1e2230',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glow-effect {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white pb-6">

    <!-- Шапка -->
    <header class="bg-cardBg/90 backdrop-blur-xl border-b border-cardBorder sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-xl text-emerald-400">
                    <i class="fa-solid fa-train text-base"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight text-zinc-100 flex items-center gap-1.5">
                        БелЖД Информер <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    </h1>
                    <p class="text-[11px] text-zinc-400">Михановичи ⇄ Минск-Пасс.</p>
                </div>
            </div>
            <a href="https://www.rw.by/" target="_blank" rel="noopener noreferrer" class="bg-zinc-800/80 hover:bg-zinc-700 text-[11px] font-medium px-3 py-1.5 rounded-lg border border-zinc-700/60 flex items-center gap-1.5 text-zinc-300">
                <i class="fa-solid fa-globe text-emerald-400 text-xs"></i> rw.by
            </a>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-md w-full mx-auto px-3 py-4 flex-grow space-y-4">
        
        <!-- Блок переключения маршрутов -->
        <div class="grid grid-cols-2 gap-2">
            <button id="btnMihToMinsk" onclick="setRoute('mih-minsk')" class="p-3 rounded-xl font-semibold text-left transition-all active:scale-[0.97] border shadow-md flex flex-col justify-between">
                <div class="text-[9px] text-zinc-500 font-mono uppercase tracking-wider mb-1">Откуда</div>
                <div class="text-xs sm:text-sm flex items-center gap-1.5 text-zinc-200">
                    <span>Михановичи</span>
                    <i class="fa-solid fa-arrow-right text-[10px] text-zinc-500"></i>
                </div>
                <div class="text-[11px] font-bold text-emerald-400 mt-1">Минск-Пасс.</div>
            </button>

            <button id="btnMinskToMih" onclick="setRoute('minsk-mih')" class="p-3 rounded-xl font-semibold text-left transition-all active:scale-[0.97] border shadow-md flex flex-col justify-between">
                <div class="text-[9px] text-zinc-500 font-mono uppercase tracking-wider mb-1">Откуда</div>
                <div class="text-xs sm:text-sm flex items-center gap-1.5 text-zinc-200">
                    <span>Минск-Пасс.</span>
                    <i class="fa-solid fa-arrow-right text-[10px] text-zinc-500"></i>
                </div>
                <div class="text-[11px] font-bold text-emerald-400 mt-1">Михановичи</div>
            </button>
        </div>

        <!-- Карточка ближайшего поезда -->
        <div class="bg-gradient-to-br from-cardBg via-[#10181b] to-cardBg border border-emerald-500/30 rounded-2xl p-4 shadow-xl relative overflow-hidden glow-effect">
            <div class="absolute -right-4 -bottom-4 opacity-5 text-8xl text-emerald-400 pointer-events-none">
                <i class="fa-solid fa-stopwatch"></i>
            </div>
            <div class="relative z-10">
                <div class="flex justify-between items-center mb-2.5">
                    <span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-[9px]"></i> Ближайший рейс
                    </span>
                    <span id="currentTime" class="text-[11px] font-mono bg-zinc-900/80 border border-zinc-800 text-zinc-400 px-2 py-0.5 rounded-md">--:--:--</span>
                </div>
                <div class="flex items-end justify-between gap-2">
                    <div>
                        <div class="text-3xl font-extrabold tracking-tight text-zinc-100 font-mono" id="nextTimeVal">--:--</div>
                        <div class="text-[11px] text-zinc-400 mt-0.5 line-clamp-1" id="nextRouteVal">Загрузка...</div>
                    </div>
                    <div class="text-right">
                        <div id="nextPlatformBadge" class="hidden text-[10px] bg-zinc-900 border border-zinc-800 text-emerald-400 font-mono px-2 py-0.5 rounded-md mb-1 inline-block">--</div>
                        <div class="bg-zinc-950/80 border border-zinc-800 rounded-xl px-3 py-1.5">
                            <div class="text-[9px] text-zinc-500 uppercase">До отправления</div>
                            <div id="countdownVal" class="text-sm font-bold font-mono text-emerald-400">-- мин</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Фильтры и поиск -->
        <div class="bg-cardBg border border-cardBorder rounded-2xl p-3 shadow-lg space-y-2.5">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                <button onclick="filterTime('next3h')" id="filter-next3h" class="px-3 py-1.5 rounded-xl text-[11px] font-medium transition-all whitespace-nowrap active:scale-95">⚡ Ближайшие 3ч</button>
                <button onclick="filterTime('all')" id="filter-all" class="px-3 py-1.5 rounded-xl text-[11px] font-medium transition-all whitespace-nowrap active:scale-95">Все</button>
                <button onclick="filterTime('morning')" id="filter-morning" class="px-3 py-1.5 rounded-xl text-[11px] font-medium transition-all whitespace-nowrap active:scale-95">Утро</button>
                <button onclick="filterTime('day')" id="filter-day" class="px-3 py-1.5 rounded-xl text-[11px] font-medium transition-all whitespace-nowrap active:scale-95">День</button>
                <button onclick="filterTime('evening')" id="filter-evening" class="px-3 py-1.5 rounded-xl text-[11px] font-medium transition-all whitespace-nowrap active:scale-95">Вечер</button>
            </div>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-500">
                    <i class="fa-solid fa-search text-[11px]"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderSchedule()" placeholder="Поиск по номеру рейса..." class="w-full pl-9 pr-3 py-2 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Список поездов -->
        <div class="bg-cardBg border border-cardBorder rounded-2xl shadow-lg overflow-hidden">
            <div class="px-4 py-3 border-b border-cardBorder flex justify-between items-center bg-zinc-900/40">
                <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ul text-emerald-500"></i> Расписание рейсов
                </span>
                <span id="trainCount" class="text-[11px] font-mono bg-zinc-800/60 border border-zinc-700/50 px-2 py-0.5 rounded text-zinc-400">0 рейсов</span>
            </div>
            <div id="scheduleList" class="divide-y divide-cardBorder">
                <!-- Динамически заполняется JS -->
            </div>
        </div>

    </main>

    <!-- Футер -->
    <footer class="max-w-md w-full mx-auto px-4 mt-6 text-center text-[11px] text-zinc-500">
        <p>Неофициальное приложение БелЖД. Данные на <a href="https://www.rw.by/" target="_blank" class="text-emerald-400 underline font-medium">rw.by</a>.</p>
    </footer>

    <!-- Скрипты -->
    <script>
        function generateStops(depTime, direction) {
            const [h, m] = depTime.split(':').map(Number);
            const addMinutes = (hours, mins, add) => {
                let total = hours * 60 + mins + add;
                let nh = Math.floor(total / 60) % 24;
                let nm = total % 60;
                return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
            };

            if (direction === 'mih-minsk') {
                return [
                    { name: 'Михановичи', time: depTime, type: 'отправление' },
                    { name: 'Асеевка', time: `${addMinutes(h, m, 3)} - ${addMinutes(h, m, 4)}`, type: 'остановка 1 мин' },
                    { name: 'Мачулищи', time: `${addMinutes(h, m, 7)} - ${addMinutes(h, m, 8)}`, type: 'остановка 1 мин' },
                    { name: 'Колядичи', time: `${addMinutes(h, m, 12)} - ${addMinutes(h, m, 13)}`, type: 'остановка 1 мин' },
                    { name: 'Лошица', time: `${addMinutes(h, m, 16)} - ${addMinutes(h, m, 17)}`, type: 'остановка 1 мин' },
                    { name: 'Минск-Южный', time: `${addMinutes(h, m, 20)} - ${addMinutes(h, m, 21)}`, type: 'остановка 1 мин' },
                    { name: 'Минск-Пассажирский', time: addMinutes(h, m, 24), type: 'прибытие' }
                ];
            } else {
                return [
                    { name: 'Минск-Пассажирский', time: depTime, type: 'отправление' },
                    { name: 'Минск-Южный', time: `${addMinutes(h, m, 4)} - ${addMinutes(h, m, 5)}`, type: 'остановка 1 мин' },
                    { name: 'Лошица', time: `${addMinutes(h, m, 8)} - ${addMinutes(h, m, 9)}`, type: 'остановка 1 мин' },
                    { name: 'Колядичи', time: `${addMinutes(h, m, 13)} - ${addMinutes(h, m, 14)}`, type: 'остановка 1 мин' },
                    { name: 'Мачулищи', time: `${addMinutes(h, m, 18)} - ${addMinutes(h, m, 19)}`, type: 'остановка 1 мин' },
                    { name: 'Асеевка', time: `${addMinutes(h, m, 21)} - ${addMinutes(h, m, 22)}`, type: 'остановка 1 мин' },
                    { name: 'Михановичи', time: addMinutes(h, m, 25), type: 'прибытие' }
                ];
            }
        }

        const rawDataMihMinsk = [
            { number: '6802', dep: '05:12', arr: '05:36', duration: '24 мин', days: 'ежедневно', platform: 'Путь 2' },
            { number: '6804', dep: '06:24', arr: '06:48', duration: '24 мин', days: 'ежедневно', platform: 'Путь 1' },
            { number: '6808', dep: '07:15', arr: '07:39', duration: '24 мин', days: 'пн-пт', platform: 'Путь 2' },
            { number: '6812', dep: '08:05', arr: '08:29', duration: '24 мин', days: 'ежедневно', platform: 'Путь 1' },
            { number: '6816', dep: '09:40', arr: '10:04', duration: '24 мин', days: 'ежедневно', platform: 'Путь 2' },
            { number: '6822', dep: '12:15', arr: '12:39', duration: '24 мин', days: 'ежедневно', platform: 'Путь 1' },
            { number: '6828', dep: '14:50', arr: '15:14', duration: '24 мин', days: 'ежедневно', platform: 'Путь 2' },
            { number: '6834', dep: '16:30', arr: '16:54', duration: '24 мин', days: 'пн-пт', platform: 'Путь 1' },
            { number: '6838', dep: '17:45', arr: '18:09', duration: '24 мин', days: 'ежедневно', platform: 'Путь 2' },
            { number: '6844', dep: '19:20', arr: '19:44', duration: '24 мин', days: 'ежедневно', platform: 'Путь 1' },
            { number: '6850', dep: '21:10', arr: '21:34', duration: '24 мин', days: 'ежедневно', platform: 'Путь 2' },
            { number: '6854', dep: '23:05', arr: '23:29', duration: '24 мин', days: 'ежедневно', platform: 'Путь 1' }
        ];

        const rawDataMinskMih = [
            { number: '6801', dep: '05:45', arr: '06:10', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 3, Путь 7' },
            { number: '6805', dep: '06:55', arr: '07:20', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 2, Путь 5' },
            { number: '6809', dep: '08:30', arr: '08:55', duration: '25 мин', days: 'пн-пт', platform: 'Пл. 3, Путь 6' },
            { number: '6815', dep: '10:15', arr: '10:40', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 2, Путь 4' },
            { number: '6821', dep: '13:00', arr: '13:25', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 3, Путь 7' },
            { number: '6827', dep: '15:40', arr: '16:05', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 2, Путь 5' },
            { number: '6833', dep: '17:10', arr: '17:35', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 3, Путь 6' },
            { number: '6837', dep: '18:25', arr: '18:50', duration: '25 мин', days: 'пн-пт', platform: 'Пл. 2, Путь 4' },
            { number: '6843', dep: '20:05', arr: '20:30', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 3, Путь 7' },
            { number: '6849', dep: '22:15', arr: '22:40', duration: '25 мин', days: 'ежедневно', platform: 'Пл. 2, Путь 5' }
        ];

        let currentRoute = 'mih-minsk';
        let currentTimeFilter = 'next3h';
        let expandedTrainNumber = null;

        function getSchedules() {
            const raw = currentRoute === 'mih-minsk' ? rawDataMihMinsk : rawDataMinskMih;
            return raw.map(item => ({
                ...item,
                stops: generateStops(item.dep, currentRoute)
            }));
        }

        function setRoute(route) {
            currentRoute = route;
            expandedTrainNumber = null;
            const btnMih = document.getElementById('btnMihToMinsk');
            const btnMinsk = document.getElementById('btnMinskToMih');

            const activeClass = "p-3 rounded-xl font-semibold text-left transition-all active:scale-[0.97] border shadow-md flex flex-col justify-between bg-emerald-500/10 border-emerald-500/50 text-emerald-400 glow-effect";
            const inactiveClass = "p-3 rounded-xl font-semibold text-left transition-all active:scale-[0.97] border shadow-md flex flex-col justify-between bg-cardBg border-cardBorder text-zinc-400 hover:bg-zinc-900";

            if (route === 'mih-minsk') {
                btnMih.className = activeClass;
                btnMinsk.className = inactiveClass;
            } else {
                btnMinsk.className = activeClass;
                btnMih.className = inactiveClass;
            }
            renderSchedule();
        }

        function filterTime(filter) {
            currentTimeFilter = filter;
            ['next3h', 'all', 'morning', 'day', 'evening'].forEach(f => {
                const b = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    b.className = "px-3 py-1.5 rounded-xl text-[11px] font-medium bg-emerald-600 text-white shadow-md shadow-emerald-600/20 transition-all whitespace-nowrap active:scale-95";
                } else {
                    b.className = "px-3 py-1.5 rounded-xl text-[11px] font-medium bg-zinc-900 border border-zinc-800 text-zinc-400 hover:bg-zinc-800 transition-all whitespace-nowrap active:scale-95";
                }
            });
            renderSchedule();
        }

        function toggleDetails(trainNumber) {
            expandedTrainNumber = expandedTrainNumber === trainNumber ? null : trainNumber;
            renderSchedule();
        }

        function renderSchedule() {
            const listContainer = document.getElementById('scheduleList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const data = getSchedules();

            const now = new Date();
            const currentTotalMin = now.getHours() * 60 + now.getMinutes();

            const filtered = data.filter(item => {
                const matchSearch = item.number.toLowerCase().includes(searchVal);
                const [h, m] = item.dep.split(':').map(Number);
                const trainTotalMin = h * 60 + m;

                let matchTime = true;
                if (currentTimeFilter === 'next3h') {
                    matchTime = trainTotalMin >= currentTotalMin && trainTotalMin <= (currentTotalMin + 180);
                } else if (currentTimeFilter === 'morning') {
                    matchTime = h >= 4 && h < 12;
                } else if (currentTimeFilter === 'day') {
                    matchTime = h >= 12 && h < 18;
                } else if (currentTimeFilter === 'evening') {
                    matchTime = h >= 18 && h <= 23;
                }

                return matchSearch && matchTime;
            });

            document.getElementById('trainCount').innerText = `${filtered.length} рейс.`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-zinc-500">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-1.5 text-zinc-600"></i>
                        <p class="text-[11px]">Рейсов не найдено</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filtered.map(item => {
                const isExpanded = expandedTrainNumber === item.number;
                return `
                    <div class="transition-all">
                        <div onclick="toggleDetails('${item.number}')" class="p-3.5 hover:bg-zinc-900/50 transition-all flex items-center justify-between gap-2 cursor-pointer">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <div class="bg-zinc-900 border border-zinc-800 text-emerald-400 font-bold px-2 py-1.5 rounded-lg text-[11px] font-mono shrink-0">
                                    №${item.number}
                                </div>
                                <div class="min-w-0">
                                    <div class="font-semibold text-xs flex items-center gap-1.5 text-zinc-200 font-mono">
                                        <span>${item.dep}</span>
                                        <i class="fa-solid fa-arrow-right text-[9px] text-zinc-600"></i>
                                        <span>${item.arr}</span>
                                        <span class="text-[10px] text-zinc-500 font-sans">(${item.duration})</span>
                                    </div>
                                    <div class="text-[10px] text-zinc-400 flex items-center gap-1.5 mt-0.5 truncate">
                                        <span class="bg-zinc-900 border border-zinc-800 px-1.5 py-0.2 rounded text-zinc-300 font-mono"><i class="fa-solid fa-train-subway text-emerald-500 text-[9px]"></i> ${item.platform}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="shrink-0">
                                <span class="text-[10px] text-emerald-400 font-medium flex items-center gap-1 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg">
                                    ${isExpanded ? 'Скрыть' : 'Станции'} <i class="fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-[9px]"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Раскрывающийся полный список станций включая Асеевку -->
                        <div class="${isExpanded ? 'block' : 'hidden'} bg-zinc-950/90 border-t border-cardBorder p-3.5">
                            <div class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                                <i class="fa-solid fa-route text-emerald-400"></i> Все остановки рейса №${item.number}
                            </div>
                            <div class="space-y-2 pl-2 border-l-2 border-emerald-500/30 ml-1.5">
                                ${item.stops.map(stop => `
                                    <div class="relative pl-3 flex justify-between items-center text-[11px]">
                                        <div class="absolute -left-[15px] top-1.5 w-1.5 h-1.5 rounded-full bg-emerald-500 ring-2 ring-zinc-950"></div>
                                        <div>
                                            <span class="font-medium text-zinc-200">${stop.name}</span>
                                            <span class="text-[9px] text-zinc-500 block">${stop.type}</span>
                                        </div>
                                        <span class="font-mono text-emerald-400 font-medium bg-zinc-900 px-1.5 py-0.5 rounded border border-zinc-800 text-[10px]">${stop.time}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            updateNextTrain(data);
        }

        function updateNextTrain(data) {
            const now = new Date();
            const currentTotalMin = now.getHours() * 60 + now.getMinutes();

            document.getElementById('currentTime').innerText = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            let nextTrain = null;
            for (let item of data) {
                const [h, m] = item.dep.split(':').map(Number);
                const trainTotalMin = h * 60 + m;
                if (trainTotalMin >= currentTotalMin) {
                    nextTrain = item;
                    break;
                }
            }

            if (!nextTrain && data.length > 0) nextTrain = data[0];

            const fromName = currentRoute === 'mih-minsk' ? 'Михановичи' : 'Минск-Пасс.';
            const toName = currentRoute === 'mih-minsk' ? 'Минск-Пасс.' : 'Михановичи';
            const platformBadge = document.getElementById('nextPlatformBadge');

            if (nextTrain) {
                document.getElementById('nextTimeVal').innerText = nextTrain.dep;
                document.getElementById('nextRouteVal').innerText = `${fromName} ➔ ${toName} (№${nextTrain.number})`;
                
                platformBadge.classList.remove('hidden');
                platformBadge.innerText = nextTrain.platform;

                const [h, m] = nextTrain.dep.split(':').map(Number);
                let trainTotalMin = h * 60 + m;
                if (trainTotalMin < currentTotalMin) trainTotalMin += 24 * 60;
                
                const diffMin = trainTotalMin - currentTotalMin;
                const hoursLeft = Math.floor(diffMin / 60);
                const minsLeft = diffMin % 60;

                let countdownText = hoursLeft > 0 ? `${hoursLeft} ч ${minsLeft} мин` : `${minsLeft} мин`;
                document.getElementById('countdownVal').innerText = countdownText;
            } else {
                document.getElementById('nextTimeVal').innerText = '--:--';
                document.getElementById('nextRouteVal').innerText = 'Нет рейсов на сегодня';
                platformBadge.classList.add('hidden');
                document.getElementById('countdownVal').innerText = '--';
            }
        }

        setRoute('mih-minsk');
        filterTime('next3h');

        setInterval(() => {
            updateNextTrain(getSchedules());
        }, 1000);
    </script>
</body>
</html>
